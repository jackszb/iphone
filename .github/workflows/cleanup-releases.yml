name: Cleanup old releases

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old releases except last 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Fetching releases..."

          releases=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases?per_page=100")

          old=$(echo "$releases" | jq -c '. | sort_by(.created_at) | reverse | .[3:] | .[] | {id: .id, tag: .tag_name}')

          if [ -z "$old" ]; then
            echo "Nothing to delete."
            exit 0
          fi

          echo "$old" | while read -r item; do
            id=$(echo "$item" | jq -r '.id')
            tag=$(echo "$item" | jq -r '.tag')

            echo "Deleting release id=$id (tag=$tag)"
            curl -s -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/$id"

            echo "Deleting tag ref=$tag"
            curl -s -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/git/refs/tags/$tag"
          done

          echo "Cleanup complete."
